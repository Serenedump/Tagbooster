<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tag Booster Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@500;700&family=Pacifico&family=Patrick+Hand&family=Playfair+Display:wght@700;800&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--page:#f2f2f6;--panel:#fff;--ink:#1c1c24;--mute:#6b6b78;--line:#d6d6e0;--btn:#1c1c24;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#16161c;--panel:#22222b;--ink:#f1f1f6;--mute:#a4a4b2;--line:#3a3a47;--btn:#ffb04a;--btnt:#1c1c24}}
:root[data-theme="dark"]{--page:#16161c;--panel:#22222b;--ink:#f1f1f6;--mute:#a4a4b2;--line:#3a3a47;--btn:#ffb04a;--btnt:#1c1c24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:600px;margin:0 auto;padding:16px 12px 40px}
#poster{width:100%;max-width:var(--w,560px);margin:0 auto;padding:18px 14px 22px;background:#ffb04a;color:var(--tc,#1c1c1c);font-family:var(--ff,Poppins),sans-serif;border-radius:6px}
#poster.art{padding:calc(min(100vw - 24px,var(--w,560px))*.27) 14px calc(min(100vw - 24px,var(--w,560px))*.33)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:-8px;position:relative;z-index:2}
.mega{font-size:3.2rem;line-height:1;transform:rotate(-8deg)}
.bubble{background:var(--cc,#fff);border:2px solid #1c1c1c;border-radius:12px;padding:6px 16px;box-shadow:0 3px 0 #1c1c1c;min-width:0}
.bubble input{border:0;background:transparent;font:800 1.5rem/1.2 var(--ff,Poppins),sans-serif;color:var(--tc,#1c1c1c);width:100%;text-transform:uppercase;padding:0}
.bubble input:focus{outline:none}
.card{position:relative;background:var(--cc,#fff);border-radius:22px;padding:34px 18px 20px;overflow:hidden}
.photo{position:absolute;inset:var(--ct,0%) var(--cr,0%) var(--cb,0%) var(--cl,0%);overflow:hidden;opacity:var(--po,.35);pointer-events:none;display:none}
.photo img{position:absolute;left:var(--px,50%);top:var(--py,50%);width:var(--ps,80%);height:auto;max-width:none;transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none}
.card.edit{outline:3px dashed #e0245e;outline-offset:-3px;touch-action:none;cursor:grab}
ul,.tags{position:relative;z-index:1}
ul{list-style:none;margin:0;padding:0;columns:2;column-gap:14px}
li{font-weight:700;font-size:var(--fs,17px);padding:4px 0;break-inside:avoid}
.tags{margin-top:12px;font-weight:600;word-break:break-word;font-size:var(--fs,17px)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:0 14px}
summary{font-weight:700;padding:13px 0;cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding-bottom:14px}
.g label{display:block;font-weight:600;font-size:.8rem;color:var(--mute);margin-bottom:4px}
.full{grid-column:1/-1}
select,input.f{width:100%;font:600 .95rem Poppins,system-ui,sans-serif;color:var(--ink);background:var(--page);border:2px solid var(--line);border-radius:10px;padding:9px 10px}
input[type=color]{width:100%;height:42px;padding:2px;border:2px solid var(--line);border-radius:10px;background:var(--page)}
input[type=range]{width:100%;accent-color:#e0245e}
input[type=file]{width:100%;font:inherit;font-size:.85rem;color:var(--ink)}
textarea.f{width:100%;min-height:180px;font:600 .9rem/1.5 Poppins,system-ui,sans-serif;color:var(--ink);background:var(--page);border:2px solid var(--line);border-radius:10px;padding:10px}
.search{margin-bottom:12px}.chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button.chipb{width:auto;padding:5px 12px;font-size:.8rem;border-radius:20px;background:var(--panel);color:var(--ink);border:2px solid var(--line);text-transform:capitalize}
.final{white-space:pre-wrap;word-break:break-word;background:var(--page);border:2px solid var(--line);border-radius:10px;padding:10px;font-weight:600;font-size:.9rem;line-height:1.5}
#cnt{float:right;font-weight:700}#cnt.over{color:#e0245e}
#opts{display:grid;gap:6px}button.opt{text-align:left;font-weight:600;border-radius:12px}button.opt.on{background:var(--btn);color:var(--btnt)}
#mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mi{border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--page)}.mi img,.mi video{display:block;width:100%;aspect-ratio:1;object-fit:cover}.mb{display:flex;gap:4px;padding:4px}.mb button{padding:6px}
.note{margin:6px 2px 0;font-size:.8rem;color:var(--mute)}
button{font:700 1rem Poppins,system-ui,sans-serif;border:2px solid var(--ink);border-radius:10px;padding:12px;cursor:pointer;background:var(--btn);color:var(--btnt);width:100%}
button.alt{background:var(--panel);color:var(--ink)}
button.sm{padding:8px;font-size:.85rem}
button:active{transform:scale(.97)}
:is(input,select,button,summary):focus-visible{outline:3px solid #e0245e;outline-offset:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
#modal{position:fixed;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:9}
#modal[hidden]{display:none}
#modal img{max-width:100%;max-height:75%;border-radius:6px}
#modal p{color:#fff;margin:0;text-align:center}
#modal button{width:auto;padding:10px 28px}
</style>
</head>
<body>
<main>
<div class="search"><input class="f" id="topic" type="search" placeholder="Search a theme: delivery, award, love..." autocomplete="off" aria-label="Search a theme"><div class="chipsrow" id="chips"></div><p class="note" id="found"></p></div>

<div id="poster">
 <div class="head"><div class="mega" aria-hidden="true">📣</div><div class="bubble"><input id="title" value="Tag Booster" aria-label="Title" maxlength="24"></div></div>
 <div class="card"><div class="photo" id="photo"><img id="phimg" alt="" draggable="false"></div><ul id="list"></ul><div class="tags" id="tags"></div></div>
</div>

<div class="acts"><button id="shuf">Shuffle</button><button id="copy" class="alt">Copy text</button><button id="save" class="full" style="grid-column:1/-1">Save as picture</button></div>

<details open><summary>Ready to post</summary><div class="g">
 <div class="full"><label for="cap">Caption (edit it if you like)</label><textarea class="f" id="cap" style="min-height:90px"></textarea></div>
 <div class="full"><label for="hash">Today's tag (the organizer types it once)</label><input class="f" id="hash" placeholder="#WillAshley" autocomplete="off"></div>
 <div class="full"><label>Final post <span id="cnt"></span></label><div class="final" id="final"></div></div>
 <div class="full"><label>Pick a caption. Each one can be used only once.</label><div id="opts"></div><button class="alt sm" id="newcap" style="margin-top:8px">Show other captions</button><p class="note" id="left"></p></div>
 <div><button class="sm" id="cpost">Copy post text</button></div><div><button class="alt sm" id="cimg">Copy picture</button></div>
 <div class="full"><button id="shpost">Share post + picture</button></div>
 <div class="full"><button class="alt sm" id="xopen">Open X with the text</button></div>
 <div class="full"><p class="note" id="pstat" aria-live="polite">Names you add under Content are tagged in the post automatically.</p></div>
</div></details>

<details open><summary>Will Ashley de Leon pictures and videos</summary><div class="g">
 <div class="full" id="mup" hidden><label for="mf">Organizer: add pictures and videos</label><input type="file" id="mf" accept="image/*,video/*" multiple></div>
 <div class="full"><div id="mgrid"></div><p class="note" id="mnote"></p></div>
</div></details>

<details><summary>Content</summary><div class="g">
 <div><label for="lang">Language</label><select id="lang"><option value="en">English</option><option value="tl">Tagalog</option></select></div>
 <div><label for="n">Number of lines</label><select id="n"><option>10</option><option>20</option><option selected>30</option></select></div>
 <div class="full"><label for="names">Names to tag (comma-separated)</label><input class="f" id="names" placeholder="Maria, John, Ana" autocomplete="off"></div>
</div></details>

<details><summary>Edit the words</summary><div class="g"><div class="full"><label for="lines">One line per row. Edit, add or delete. Shuffle replaces them.</label><textarea class="f" id="lines"></textarea></div></div></details>

<details><summary>Text and colors</summary><div class="g">
 <div class="full"><label for="ff">Font style</label><select id="ff">
  <option value="Poppins">Poppins (clean)</option><option value="Fredoka">Fredoka (rounded)</option><option value="Pacifico">Pacifico (handwritten)</option><option value="Playfair Display">Playfair (elegant)</option><option value="Bebas Neue">Bebas Neue (tall)</option><option value="Patrick Hand">Patrick Hand (doodle)</option><option value="Courier New">Typewriter</option></select></div>
 <div class="full"><label for="fs">Font size: <span id="fsv"></span>px</label><input type="range" id="fs" min="11" max="30" value="17"></div>
 <div><label for="tc">Text color</label><input type="color" id="tc" value="#1c1c1c"></div>
 <div><label for="cc">Card color</label><input type="color" id="cc" value="#ffffff"></div>
</div></details>

<details><summary>Background</summary><div class="g">
 <div class="full"><label for="bp">Design</label><select id="bp">
  <option value="art" selected>Tag Booster art (pink &amp; black)</option><option value="solid">Solid color</option><option value="grad">Gradient</option><option value="dots">Polka dots</option><option value="stripes">Stripes</option><option value="checker">Checkerboard</option><option value="hearts">Hearts</option><option value="photo">My own photo</option></select></div>
 <div><label for="c1">Color 1</label><input type="color" id="c1" value="#ffb04a"></div>
 <div><label for="c2">Color 2</label><input type="color" id="c2" value="#ffffff"></div>
 <div class="full"><label for="bs">Pattern size: <span id="bsv"></span>px</label><input type="range" id="bs" min="12" max="90" value="32"></div>
 <div class="full"><label for="bf">Background photo</label><input type="file" id="bf" accept="image/*"></div>
</div></details>

<details><summary>Picture inside the card</summary><div class="g">
 <div class="full"><label for="pf">Upload a picture</label><input type="file" id="pf" accept="image/*"></div>
 <div class="full"><button class="sm" id="edit">Move and zoom on card</button></div>
 <div class="full"><label>Drag with one finger to move. Pinch with two fingers to zoom. Tap Done moving when finished.</label></div>
 <input type="hidden" id="ps" value="80"><input type="hidden" id="px" value="50"><input type="hidden" id="py" value="50">
 <input type="hidden" id="ct" value="0"><input type="hidden" id="cb" value="0"><input type="hidden" id="cl" value="0"><input type="hidden" id="cr" value="0">
 <div class="full"><label for="po">Opacity: <span id="pov"></span>%</label><input type="range" id="po" min="5" max="100" value="35"></div>
 <div><button class="alt sm" id="prs">Reset position</button></div>
 <div><button class="alt sm" id="prm">Remove picture</button></div>
</div></details>

<details><summary>Overall size</summary><div class="g">
 <div class="full"><label for="w">Width: <span id="wv"></span>px</label><input type="range" id="w" min="280" max="560" value="560"></div>
</div></details>
</main>

<div id="modal" hidden><p>Press and hold the picture to save it.</p><img id="out" alt="Tag booster picture"><button id="close">Close</button></div>

let editing=false;const card=document.querySelector('.card'),ptrs=new Map();let last=0;

 if(ptrs.size===1&&r.width&&r.height){set('px',+$('px').value+(e.clientX-prev.x)/r.width*100,-50,150);set('py',+$('py').value+(e.clientY-prev.y)/r.height*100,-50,150)}

async function toPng(m){
 const b=await mblob(m);if(m.type==='image/png')return b;
 const bm=await createImageBitmap(b),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
 return new Promise(r=>c.toBlob(r,'image/png'));
}
async function copyM(m){
 try{
  if(/^image\/(png|jpe?g|webp)/.test(m.type)&&navigator.clipboard&&window.ClipboardItem){
   await navigator.clipboard.write([new ClipboardItem({'image/png':toPng(m)})]);say('Picture copied! Paste it in your post.');return}
  const f=new File([await mblob(m)],m.name||'media',{type:m.type});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
  else say("GIFs and videos can't be copied here. Tap Download instead.");
 }catch(e){if(!e||e.name!=='AbortError')say("Couldn't copy that. Tap Download instead.")}
}
async function shareM(m){
 try{const b=await mblob(m),f=new File([b],m.name||'media',{type:m.type});
  await copyText(postText());
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:postText()});say('Shared! If the caption is missing, paste it. It is already copied.')}
  else{say('Caption copied. Save the file, then post both on X.');saveM(m)}
 }catch(e){if(!e||e.name!=='AbortError')say("Couldn't share that file.")}
}
async function delM(m){if(!confirm('Remove this from the library?'))return;try{await A.delete(m.id);await D.doc('media/'+m.id).delete()}catch(e){say("Couldn't remove it.")}}
function renderMedia(){
 const g=$('mgrid');g.innerHTML='';
 MEDIA.forEach(m=>{const t=document.createElement('div');t.className='mi';const v=(m.type||'').startsWith('video'),e=document.createElement(v?'video':'img');
  e.src=m.url;if(v){e.controls=true;e.preload='metadata';e.playsInline=true}else e.alt=m.name||'';t.appendChild(e);
  const bar=document.createElement('div');bar.className='mb';
  [['Copy',()=>copyM(m)],['Download',()=>saveM(m)],['Share',()=>shareM(m)]].concat(ED&&A?[['✕',()=>delM(m)]]:[]).forEach(([l,f])=>{const b=document.createElement('button');b.type='button';b.className='sm alt';b.textContent=l;b.onclick=f;bar.appendChild(b)});
  t.appendChild(bar);g.appendChild(t)});
 $('mnote').textContent=MEDIA.length?'':(D?'No pictures or videos yet. The organizer can add them above.':'No pictures or videos yet.');
}
$('mf').onchange=async()=>{
 for(const f of $('mf').files){try{const r=await A.upload(f);await D.doc('media/'+r.id).set({url:r.url,type:f.type,name:f.name,at:Date.now()})}catch(e){say("Couldn't upload "+f.name)}}
 $('mf').value='';
};
(async()=>{
 renderMedia();
 if(!(window.claude&&claude.use)){
  const q=new URLSearchParams(location.search).get('tag');
  if(q){$('hash').value=q.split(/[\s,]+/).filter(Boolean).map(t=>'#'+t.replace(/^#/,'')).join(' ');$('hash').readOnly=true;renderOpts();updatePost()}
  else try{const c=await(await fetch('config.json',{cache:'no-store'})).json();$('hash').value=c.tag||'';$('hash').readOnly=!!c.tag;renderOpts();updatePost()}catch(e){}
  try{const j=await(await fetch('media.json',{cache:'no-store'})).json();
   MEDIA=j.map((f,i)=>({id:'s'+i,url:f,name:f.split('/').pop(),type:/\.(mp4|webm|mov)$/i.test(f)?'video/mp4':/\.gif$/i.test(f)?'image/gif':/\.png$/i.test(f)?'image/png':'image/jpeg'}));ED=false;renderMedia()}catch(e){}
  return}
 try{
  const u=await claude.use('user');ED=u?u.canEdit():false;
  D=await claude.use('db');A=await claude.use('assets');DL=await claude.use('downloads');
  $('mup').hidden=!(ED&&A&&D);$('hash').readOnly=!!D&&!ED;
  if(D){
   D.doc('config/today').onSnapshot(sn=>{if(sn.exists&&document.activeElement!==$('hash')){$('hash').value=sn.data().tag||'';renderOpts();updatePost()}});
   D.collection('used').onSnapshot(sn=>{USED=new Set([...LOCAL,...sn.docs.map(d=>d.id)]);renderOpts()});
   D.collection('media').orderBy('at','desc').onSnapshot(sn=>{MEDIA=sn.docs.map(d=>d.data());MEDIA.forEach((m,i)=>m.id=sn.docs[i].id);renderMedia()});
  }
 }catch(e){}
})();
apply();gen();
</script>
